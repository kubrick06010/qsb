name: Swift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Build portable products
        run: swift build --target QSBCore && swift build --product qsb
      - name: Test portable core
        run: swift test --filter QSBCorePortableTests
      - name: Test legacy fixtures
        run: |
          if [[ -d reference/winqsb ]]; then
            swift test
          else
            echo "::notice::Legacy fixture tests are unavailable because reference/winqsb is intentionally not versioned; portable tests ran above."
          fi

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0"
      - name: Show Swift version
        run: swift --version
      - name: Build macOS app
        run: swift build --product QSBMacApp
