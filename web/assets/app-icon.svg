<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="appShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="32" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2229"/>
      <stop offset="50%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#0A0C0E"/>
    </linearGradient>
    <linearGradient id="qRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="qTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="qShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with drop shadow -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg2)" filter="url(#appShadow)"/>

  <g clip-path="url(#squircleClip)">
    <!-- Fine blueprint / coordinate grid -->
    <path d="M 64 256 L 960 256 M 64 512 L 960 512 M 64 768 L 960 768 M 256 64 L 256 960 M 512 64 L 512 960 M 768 64 L 768 960"
          stroke="#475569" stroke-opacity="0.14" stroke-width="3"/>

    <!-- Subtle circular radar guides -->
    <circle cx="472" cy="472" r="340" fill="none" stroke="#475569" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- THE SCULPTURAL 'Q' -->
    <g filter="url(#qShadow)">
      <!-- Outer ring -->
      <path d="M 472 200 C 622 200 744 322 744 472 C 744 622 622 744 472 744 C 322 744 200 622 200 472 C 200 322 322 200 472 200 Z
               M 472 312 C 384 312 312 384 312 472 C 312 560 384 632 472 632 C 560 632 632 560 632 472 C 632 384 560 312 472 312 Z"
            fill="url(#qRingGrad)"/>

      <!-- Inner bevel highlight -->
      <path d="M 472 204 C 620 204 740 324 740 472" fill="none" stroke="#93C5FD" stroke-width="6" opacity="0.6"/>

      <!-- Directed Arc / Tail of the Q -->
      <path d="M 560 560 C 620 620 700 680 790 770"
            fill="none" stroke="url(#qTailGrad)" stroke-width="56" stroke-linecap="round"/>
      <path d="M 560 560 C 620 620 700 680 790 770"
            fill="none" stroke="#FED7AA" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Network state nodes embedded along the Q's ring -->
    <circle cx="472" cy="256" r="16" fill="#60A5FA"/>
    <circle cx="256" cy="472" r="16" fill="#60A5FA"/>
    <circle cx="472" cy="688" r="16" fill="#60A5FA"/>

    <!-- State transitions (arrows) around the ring -->
    <polygon points="500,256 480,246 480,266" fill="#BFDBFE"/>
    <polygon points="256,500 246,480 266,480" fill="#BFDBFE"/>

    <!-- Terminal Target Node (at tail tip) -->
    <circle cx="790" cy="770" r="64" fill="#EA580C" opacity="0.3" filter="url(#glowGold)"/>
    <circle cx="790" cy="770" r="32" fill="#F97316"/>
    <circle cx="790" cy="770" r="20" fill="#FFEDD5"/>

    <!-- Subtle bottom watermark text 'QSB' -->
    <text x="150" y="850" fill="#64748B" font-family="-apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="8" opacity="0.45">QSB</text>

    <!-- Rim highlight for macOS squircle -->
    <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="url(#rimLight)" stroke-width="6"/>
  </g>
</svg>
